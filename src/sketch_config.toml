[BF] # Bloom Filter

    [BF.para] # parameters
    num_bits = 2577607 # (ln(1/eps)/(ln2)^2)*n
    num_hash = 5 # 0.7m/n

    [BF.test] # testing metrics
    sample = 0.3             # Sample 30% records as a sample
    insert = ["RATE"]        # Metric for insertion
    lookup = ["RATE", "PRC"] # Metric for looking up

    [BF.data] # testing data
    data = "../data/records.bin"  # Path to data, being either relative or absolute.
                                  # But remember to QUOTE it!
                                  # Relative to `build/`.
    format = [["flowkey", "padding"], [13, 2]]
    # Format of records in data
    # Grammar:
    #   | Field Name | Viable Length | Further Constraints                   |
    #   |:-----------|:--------------|:--------------------------------------|
    #   | flowkey    | 4, 8, 13      | Specify exactly once                  |
    #   | timestamp  | 1, 2, 4, 8    | In microseconds. Specify at most once |
    #   | length     | 1, 2, 4, 8    | Specify at most once                  |
    #   | padding    | > 0           | None                                  |

[CM] # Count Min Sketch

  [CM.para]
  depth = 4
  #width = 1000
  width = 115001

  [CM.data]
  cnt_method = "InPacket"
  data = "../data/data-100K-5.bin"
  format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]

  [CM.test]
  update = ["RATE"]
  query = ["RATE", "ARE", "AAE", "RCD"]

  [CM.ch]
  cnt_no_ratio = 0.3
  width_cnt = [10, 7]
  no_hash = [3]

[HP] # Hash Pipe

  [HP.para]
  depth = 5
  width = 5222

  [HP.data]
  hx_method = "TopK"
  threshold_heavy_hitter = 10000
  cnt_method = "InPacket"
  data = "../data/data-100K-5.bin"
  format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]

  [HP.test]
  update = ["RATE"]
  heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1"]

[FlowRadar] # Flow Radar

  [FlowRadar.para]
    flow_filter_bit = 3080150
    flow_filter_hash = 10
    count_table_num = 140510
    count_table_hash = 3
  
  [FlowRadar.data]
    data = "../data/data-100K-5.bin"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
  
  [FlowRadar.test]
    update = []
    decode = ["AAE", "RATIO", "ACC", "PODF"]
    decode_podf = 0.01

[DT] # Deltoid

  [DT.para]
  num_hash = 2
  num_group = 5000

  [DT.data]
  hx_method = "TopK"
  threshold_heavy_hitter = 800
  cnt_method = "InPacket"
  data = "../data/data-100K-5.bin"
  format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]

  [DT.test]
  update = ["RATE"]
  query = ["RATE", "ARE", "AAE"]
  heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1"]

  [DT.ch]
  cnt_no_ratio = 0.09
  width_cnt = [9, 10]
