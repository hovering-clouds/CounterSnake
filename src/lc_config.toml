[Lc] # Layer Counter
  
  [Lc.dway]
    sketch = ["CM","FR","HP","DT","PR","ES","MV","SL"]
    data = "../data/data-100K.bin"
    cnt_method = "InPacket"
    group_num = 64
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [8, 8, 16]
    dway = [0, 8, 1]

  [Lc.brick]
    sketch = ["CM","FR","HP","DT","PR","ES","MV","SL"]
    data = "../data/data-100K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [8, 8, 16]
    no_cnt = [64, 8, 1]

  [Lc.pyramid]
    sketch = ["CM","FR","HP","DT","PR","ES","MV","SL"]
    data = "../data/data-100K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [8, 8, 16]


[CM]

  [CM.para]
    depth = 3
    width = 80001

  [CM.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE", "RCD"]
  

[CMHEAP]

  [CMHEAP.para]
    depth = 2
    width = 80001
    pre_thre = 100

  [CMHEAP.data]
    hx_method = "Percentile"
    threshold_heavy_hitter = 0.0009173226287898038
    #threshold_heavy_hitter = 0.0005

  [CMHEAP.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE", "RCD"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "RCD"]


[FlowRadar]

  [FlowRadar.para]
    flow_filter_bit = 2380150
    flow_filter_hash = 30
    count_table_num = 142510
    count_table_hash = 3

  [FlowRadar.test]
    update = ["RATE"]
    decode = ["TIME", "ARE", "AAE", "RATIO", "ACC", "PODF"]
    decode_podf = 0.01


[HP]

  [HP.para]
    depth = 15
    width = 8222

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 6000

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1"]


[DT]

  [DT.para]
    num_hash = 2
    num_group = 3000

  [DT.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 500

  [DT.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1"]


[PR]
  
  [PR.para]
    counter_length = 180000
    counter_hash_num = 3
    filter_length = 1548000
    filter_hash_num = 3
    phi = 10

  [PR.test]
    update = ["RATE"]
    decode = ["TIME", "ARE", "AAE", "RATIO", "PODF"]
    decode_podf = 0.01


[ES]
  
  [ES.para]
    num_buckets = 800
    num_per_bucket = 1
    l_depth = 3
    l_width = 90001

  [ES.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE"]


[MV]

  [MV.para]
    depth = 2
    width = 14561

  [MV.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 3000

  [MV.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL","F1"]


[SL]

  [SL.para]
    depth = 2
    width = 3000

  [SL.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 1000

  [SL.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1"]
