[Lc] # Layer Counter
  
  [Lc.dway]
    sketch = ["HP"]
    data = "../data/zipf-075.bin"
    cnt_method = "InPacket"
    group_num = 64
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [6, 6, 6, 4]
    dway = [0, 48, 48, 2]

[HP]

  [HP.para]
    depth = 3
    width = 100

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 65

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1", "RCD"]
