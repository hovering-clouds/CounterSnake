[Lc] # Layer Counter
  
  [Lc.bs]
    sketch = ["HP"]
    data = "../data/data-1000K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    no_cnt_ratio = 0.16
    width_cnt = [6, 6, 6, 4]
    no_hash = [3, 3, 3]
    aux_width_ratio = 0.38
    aux_depth = 3



[HP]

  [HP.para]
    depth = 5
    width = 100222

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 50000

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1", "RCD"]

