[Lc] # Layer Counter
  
  [Lc.bs]
    sketch = ["HP"]
    data = "../data/zipf-175.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    no_cnt_ratio = 0.3
    width_cnt = [6, 6, 8, 8]
    no_hash = [3, 3, 3]
    aux_width_ratio = 0.8
    aux_depth = 3



[HP]

  [HP.para]
    depth = 3
    width = 32000

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 25000

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1", "RCD"]
