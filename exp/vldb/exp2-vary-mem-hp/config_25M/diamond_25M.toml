[Lc] # Layer Counter
  
  [Lc.diamond]
    sketch = ["HP"]
    data = "../data/data-1000K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [7, 7, 8, 8]
    no_cnt_ratio = [0.6, 0.5, 0.5]
    cnt_del_ratio = 0.6
    cnt_carry_ratio = 1.2
    no_hash_inc = 3
    no_hash_del = 3
    no_hash_carry = 3


[HP]

  [HP.para]
    depth = 3
    width = 32222

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 50000

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1", "RCD"]

