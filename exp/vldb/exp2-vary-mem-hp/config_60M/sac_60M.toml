[Lc] # Layer Counter

  [Lc.sac]
    sketch = ["HP"]
    data = "../data/data-1000K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    cnt_len = 12



[HP]

  [HP.para]
    depth = 5
    width = 75022

  [HP.data]
    hx_method = "TopK"
    threshold_heavy_hitter = 50000

  [HP.test]
    update = ["RATE"]
    heavyhitter = ["TIME", "ARE", "PRC", "RCL", "F1", "RCD"]

