[Lc] # Layer Counter

  [Lc.diamond]
    sketch = ["CS"]
    data = "../data/data-1000K.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    width_cnt = [6, 6, 4, 4]
    no_cnt_ratio = [0.15, 0.15, 0.15]
    cnt_del_ratio = 0.5
    cnt_carry_ratio = 1.2
    no_hash_inc = 3
    no_hash_del = 3
    no_hash_carry = 3


[CS]

  [CS.para]
    depth = 4
    width = 820001

  [CS.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE", "RCD"]
  
