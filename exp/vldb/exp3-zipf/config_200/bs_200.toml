[Lc] # Layer Counter
  
  [Lc.bs]
    sketch = ["CM"]
    data = "../data/zipf-200.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    no_cnt_ratio = 0.12
    width_cnt = [6, 6, 6, 6]
    no_hash = [3, 3, 3]
    aux_width_ratio = 0.3
    aux_depth = 3



[CM]

  [CM.para]
    depth = 4
    width = 4000001

  [CM.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE", "RCD"]
