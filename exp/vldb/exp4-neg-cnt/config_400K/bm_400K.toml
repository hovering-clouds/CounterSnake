[Lc] # Layer Counter

  [Lc.bitmatcher]
    sketch = ["CS"]
    data = "../data/kosarak.bin"
    cnt_method = "InPacket"
    format = [["flowkey", "padding", "timestamp", "length", "padding"], [13, 3, 8, 2, 6]]
    bkt_rate = 3.0


[CS]

  [CS.para]
    depth = 4
    width = 36001

  [CS.test]
    update = ["RATE"]
    query = ["RATE", "ARE", "AAE", "RCD"]

